packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  esbuild: true
permissions:
  '@tanstack/devtools-vite':
    skills: false
  '@tanstack/react-start':
    skills: false
autoInstallPeers: false
ignoredOptionalDependencies:
  # WASI fallback of oxc-parser (TanStack devtools); we only run on native linux/darwin.
  - "@oxc-parser/binding-wasm32-wasi"
