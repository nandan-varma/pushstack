extend type Organization implements ProjectV2Owner {
  """The Node ID of the Organization object"""
  id: ID!
  """Find a project by number."""
  projectV2(
    """The project number."""
    number: Int!
  ): ProjectV2
  """A list of projects under the owner."""
  projectsV2(
    """Returns the elements in the list that come after the specified cursor."""
    after: String
    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String
    """Returns the first _n_ elements from the list."""
    first: Int
    """Returns the last _n_ elements from the list."""
    last: Int
    """Filter projects based on user role."""
    minPermissionLevel: ProjectV2PermissionLevel = READ
    """How to order the returned projects."""
    orderBy: ProjectV2Order = { field: NUMBER, direction: DESC }
    """A project to search for under the owner."""
    query: String
  ): ProjectV2Connection!
}

"""An iteration field inside a project."""
type ProjectV2IterationField {
  """The Node ID of the ProjectV2IterationField object"""
  id: ID!
  """The project field's name."""
  name: String!
  """The field's type."""
  dataType: ProjectV2FieldType!
}

"""The value of an iteration field in a Project item."""
type ProjectV2ItemFieldIterationValue implements Node {
  """The Node ID of the ProjectV2ItemFieldIterationValue object"""
  id: ID!
  """The project field that contains this value."""
  field: ProjectV2FieldConfiguration!
  """The ID of the iteration."""
  iterationId: String!
  """The title of the iteration."""
  title: String!
  """The start date of the iteration."""
  startDate: Date!
  """The duration of the iteration in days."""
  duration: Int!
}

