	edges: [IssueCommentEdge]
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	Identifies the total count of items in the connection.
	"""
	totalCount: Int!
}

"""
An edge in a connection.
"""
type IssueCommentEdge {
	"""
	A cursor for use in pagination.
	"""
	cursor: String!
	"""
	The item at the end of the edge.
	"""
	node: IssueComment
}

"""
A group of emoji reactions to a particular piece of content.
"""
type ReactionGroup {
	"""
	Identifies the emoji reaction.
	"""
	content: ReactionContent!
	"""
	Users who have reacted to the reaction subject with the emotion represented by this reaction group
	"""
	users: ReactingUserConnection!
		@deprecated(
			reason: "Reactors can now be mannequins, bots, and organizations. Use the `reactors` field instead. Removal on 2021-10-01 UTC."
		)
}

"""
Emojis that can be attached to Issues, Pull Requests and Comments.
"""
enum ReactionContent {
	"""
	Represents the `:confused:` emoji.
	"""
	CONFUSED
	"""
	Represents the `:eyes:` emoji.
	"""
	EYES
	"""
	Represents the `:heart:` emoji.
	"""
	HEART
	"""
	Represents the `:hooray:` emoji.
	"""
	HOORAY
	"""
	Represents the `:laugh:` emoji.
	"""
	LAUGH
	"""
	Represents the `:rocket:` emoji.
	"""
	ROCKET
	"""
	Represents the `:-1:` emoji.
	"""
	THUMBS_DOWN
	"""
	Represents the `:+1:` emoji.
	"""
	THUMBS_UP
}

"""
Represents the rollup for both the check runs and status for a commit.
"""
type StatusCheckRollup {
	"""
	A list of status contexts and check runs for this commit.
	"""
	contexts(
		"""
		Returns the elements in the list that come after the specified cursor.
		"""
		after: String
		"""
		Returns the elements in the list that come before the specified cursor.
		"""
		before: String
		"""
		Returns the first _n_ elements from the list.
		"""
		first: Int
		"""
		Returns the last _n_ elements from the list.
		"""
		last: Int
	): StatusCheckRollupContextConnection!
}

"""
Types that can be inside a StatusCheckRollup context.
"""
union StatusCheckRollupContext = CheckRun | StatusContext

"""
The connection type for StatusCheckRollupContext.
"""
type StatusCheckRollupContextConnection {
	"""
	A list of nodes.
	"""
	nodes: [StatusCheckRollupContext]
	"""
	A list of edges.
	"""
	edges: [StatusCheckRollupContextEdge]
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	Identifies the total count of items in the connection.
	"""
	totalCount: Int!
}

"""
An edge in a connection.
"""
type StatusCheckRollupContextEdge {
	"""
	A cursor for use in pagination.
	"""
	cursor: String!
	"""
	The item at the end of the edge.
	"""
	node: StatusCheckRollupContext
}

"""
Represents an individual commit status context
"""
type StatusContext {
	"""
	The name of this status context.
	"""
	context: String!
	"""
	The state of this status context.
	"""
	state: StatusState!
	"""
	The URL for this status context.
	"""
	targetUrl: URI
	"""
	Identifies the date and time when the object was created.
	"""
	createdAt: DateTime!
	"""
	The description for this status context.
	"""
	description: String
}

"""
The possible commit status states.
"""
enum StatusState {
	"""
	Status is errored.
	"""
	ERROR
	"""
	Status is expected.
	"""
	EXPECTED
	"""
	Status is failing.
	"""
	FAILURE
	"""
	Status is pending.
	"""
	PENDING
	"""
	Status is successful.
	"""
	SUCCESS
}

"""
A check run.
"""
type CheckRun {
	"""
	The name of the check for this check run.
	"""
	name: String!
	"""
	The check suite that this run is a part of.
	"""
	checkSuite: CheckSuite!
	"""
	The current status of the check run.
	"""
	status: CheckStatusState!
	"""
	The conclusion of the check run.
	"""
	conclusion: CheckConclusionState
	"""
	Identifies the date and time when the check run was started.
	"""
	startedAt: DateTime
	"""
	Identifies the date and time when the check run was completed.
	"""
	completedAt: DateTime
	"""
	The URL from which to find full details of the check run on the integrator's site.
	"""
	detailsUrl: URI
}

"""
The possible states for a check suite or run status.
"""
enum CheckStatusState {
	"""
	The check suite or run has been completed.
	"""
	COMPLETED
	"""
	The check suite or run is in progress.
	"""
	IN_PROGRESS
	"""
	The check suite or run is in pending state.
	"""
	PENDING
	"""
	The check suite or run has been queued.
	"""
	QUEUED
	"""
	The check suite or run has been requested.
	"""
	REQUESTED
	"""
	The check suite or run is in waiting state.
	"""
	WAITING
}

"""
The possible states for a check suite or run conclusion.
"""
enum CheckConclusionState {
	"""
	The check suite or run requires action.
	"""
	ACTION_REQUIRED
	"""
	The check suite or run has been cancelled.
	"""
	CANCELLED
	"""
	The check suite or run has failed.
	"""
	FAILURE
	"""
	The check suite or run was neutral.
	"""
	NEUTRAL
	"""
	The check suite or run was skipped.
	"""
	SKIPPED
	"""
	The check suite or run was marked stale by GitHub. Only GitHub can use this conclusion.
	"""
	STALE
	"""
	The check suite or run has failed at startup.
	"""
	STARTUP_FAILURE
	"""
	The check suite or run has succeeded.
	"""
	SUCCESS
	"""
	The check suite or run has timed out.
	"""
	TIMED_OUT
}

"""
A check suite.
"""
type CheckSuite {
	"""
	The workflow run associated with this check suite.
	"""
	workflowRun: WorkflowRun
}

"""
A workflow run.
"""
type WorkflowRun {
	"""
	The workflow executed in this workflow run.
	"""
	workflow: Workflow!
}

"""
A workflow contains meta information about an Actions workflow file.
"""
type Workflow {
	"""
	The name of the workflow.
	"""
	name: String!
}

"""
The connection type for User.
"""
type ReactingUserConnection {
	"""
	Identifies the total count of items in the connection.
	"""
	totalCount: Int!
}

extend type Release {
	"""
	The tag commit for this release.
	"""
	tagCommit: Commit
}
