name: Release packages

# Tag `<package>@v<version>` (e.g. `git-fs-s3@v0.16.0`, annotated: `git tag -m`)
# to publish packages/<package> to npm with trusted publishing (OIDC): no
# stored token. Each package's npm settings must list this repository and this
# workflow file as its trusted publisher.
on:
  push:
    tags:
      - "git-fs-s3@v*"
      - "git-edge@v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the package version
        id: pkg
        run: |
          name="${GITHUB_REF_NAME%@v*}"
          version="${GITHUB_REF_NAME##*@v}"
          actual="$(node -p "require('./packages/$name/package.json').version")"
          test "$version" = "$actual" || { echo "tag $version != package.json $actual"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - run: pnpm exec turbo run typecheck test build --filter=${{ steps.pkg.outputs.name }}
      # pnpm pack rewrites workspace:* ranges to real versions; npm publishes
      # the tarball with OIDC.
      - working-directory: packages/${{ steps.pkg.outputs.name }}
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP/pkg"
          npm publish "$RUNNER_TEMP"/pkg/*.tgz --access public --provenance
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
