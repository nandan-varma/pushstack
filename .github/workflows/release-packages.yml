name: Release packages

# Tag `<package>@v<version>` (e.g. `git-fs-s3@v0.16.0`, `pstk@v0.1.0`;
# annotated: `git tag -m`) to publish that workspace to npm with trusted
# publishing (OIDC): no stored token and no NODE_AUTH_TOKEN — each package's npm
# settings list this repository and this workflow file as its trusted publisher.
on:
  push:
    tags:
      - "git-fs-s3@v*"
      - "git-edge@v*"
      - "pstk@v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      # The tag names the package; the workspace directory comes from the
      # manifest, so `apps/cli` and `packages/*` publish the same way.
      - name: Resolve the package and check the tag against its version
        id: pkg
        run: |
          name="${GITHUB_REF_NAME%@v*}"
          version="${GITHUB_REF_NAME##*@v}"
          directory="$(node scripts/workspace-directory.mjs "$name")"
          actual="$(node -p "require('./$directory/package.json').version")"
          test "$version" = "$actual" || { echo "tag $version != package.json $actual"; exit 1; }
          {
            echo "name=$name"
            echo "directory=$directory"
          } >> "$GITHUB_OUTPUT"
      - run: pnpm exec turbo run typecheck test build --filter=${{ steps.pkg.outputs.name }}
      # pnpm pack rewrites workspace:* ranges to real versions; npm publishes
      # the tarball with OIDC.
      - working-directory: ${{ steps.pkg.outputs.directory }}
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP/pkg"
          npm publish "$RUNNER_TEMP"/pkg/*.tgz --access public --provenance
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
