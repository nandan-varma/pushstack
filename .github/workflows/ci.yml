name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Re-run the gates by hand (for example after a runner outage) without an
  # empty commit.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer commit makes a PR's run obsolete. A push to main is left to finish:
  # its turbo cache is what every later PR restores (see the cache steps below).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here writes to the repository; the release workflow is the only one
# that needs more than read access. Every checkout below also turns off
# credential persistence, so a step cannot push with this workflow's token.
permissions:
  contents: read

env:
  # Anonymous telemetry is one more network round trip per task.
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # Every workspace task through turbo's graph, one job per task so they run in
  # parallel and each failure is reported. Turbo's cache is restored from the
  # last push to main, so a PR only rebuilds the workspaces it changed.
  ci:
    # Pinned rather than `-latest`: a runner image change should not silently
    # change what CI tested. `ubuntu-24.04-arm` is the same 4 vCPU / 16 GB shape
    # and is free for public repositories; switch it here and in codeql.yml
    # together, once there is a measured reason to.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # smoke:git drives the real `git` binary against the app's smart-HTTP
        # route and the real `gh` against its REST and GraphQL routes over
        # loopback HTTPS (pglite + in-memory S3, scratch HOME): the only suites
        # that exercise the wire protocols. audit fails on any known advisory.
        task: [check, typecheck, test, build, "smoke:git", audit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          # `pnpm audit` reads the lockfile through the registry; it does not
          # need the workspace installed.
          install: ${{ matrix.task != 'audit' }}
      # Turborepo's local cache lives on the runner and dies with it, so a
      # fresh runner would rebuild every package. A pull_request run may read
      # the default branch's caches, but anything it saves is scoped to its
      # merge ref and can only be restored by that PR's own re-runs: writing
      # there would churn the 10 GB budget without helping the next PR. So
      # every job restores, and only the build job on a push to main saves.
      - name: Restore turbo cache
        if: matrix.task != 'check' && matrix.task != 'audit'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.arch }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.arch }}-
      # The gh version the GraphQL fixtures were captured from
      # (apps/web/src/server/graphql/__fixtures__/gh), not the runner's.
      - name: Install gh 2.102.1
        if: matrix.task == 'smoke:git'
        run: |
          curl -sSfLo gh.tgz \
            https://github.com/cli/cli/releases/download/v2.102.1/gh_2.102.1_linux_amd64.tar.gz
          echo "77b9e297e94c50336823d0f84de7ef1be60cba704601fa0d98f129f47a94987b  gh.tgz" \
            | sha256sum -c
          tar -xzf gh.tgz
          echo "$PWD/gh_2.102.1_linux_amd64/bin" >> "$GITHUB_PATH"
      - run: pnpm ${{ matrix.task }}
      # One writer keeps the cache bounded and predictable: this archive holds
      # every package's build output, which is exactly what the other jobs'
      # `^build` tasks and smoke:git's app rebuild need.
      - name: Save turbo cache
        if: github.event_name == 'push' && matrix.task == 'build'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.arch }}-${{ github.sha }}
        # A re-run of an already-cached commit finds the key present; that is
        # not a CI failure.
        continue-on-error: true

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Secrets live in history, not just at the tip.
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks CLI over the whole history, not gitleaks-action: the
      # action scans a PR's commit range with `git log base..head`, which
      # fails on the subtree-imported histories in packages/*. Fake test
      # tokens are allowlisted by fingerprint in .gitleaksignore.
      - name: gitleaks
        run: |
          curl -sSfLo gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" \
            | sha256sum -c
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git . --no-banner --redact

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint checks the workflows and the composite actions themselves.
      # A broken release workflow is otherwise only discovered by pushing a
      # tag, which is exactly how 0.15.1 was tagged without publishing.
      - name: actionlint
        run: |
          curl -sSfLo actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tgz" \
            | sha256sum -c
          tar -xzf actionlint.tgz actionlint
          ./actionlint
