name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository; the release workflow is the only one
# that needs more than read access. Every checkout below also turns off
# credential persistence, so a step cannot push with this workflow's token.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: [typecheck, test, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm, Node (from .node-version) and a frozen-lockfile install.
      - uses: ./.github/actions/setup
      # Every workspace (apps/*, packages/*) through turbo's task graph.
      - run: pnpm ${{ matrix.task }}

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # One biome config for the whole repository.
      - run: pnpm check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm audit

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Drives the real `git` binary against the app's own smart-HTTP route.
      # pglite and a fake in-memory S3 stand in for the database and object
      # storage, and the suite writes its own git identity into a scratch HOME,
      # so this needs no services, no secrets, and no runner git config — just
      # the `git` binary ubuntu-latest already has. It is the only suite that
      # exercises the wire protocol rather than isomorphic-git talking to
      # itself.
      - uses: ./.github/actions/setup
      - run: pnpm smoke:git

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Secrets live in history, not just at the tip.
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks CLI over the whole history, not gitleaks-action: the
      # action scans a PR's commit range with `git log base..head`, which
      # fails on the subtree-imported histories in packages/*. Fake test
      # tokens are allowlisted by fingerprint in .gitleaksignore.
      - name: gitleaks
        run: |
          curl -sSfLo gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" \
            | sha256sum -c
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git . --no-banner --redact

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint checks the workflows and the composite actions themselves.
      # A broken release workflow is otherwise only discovered by pushing a
      # tag, which is exactly how 0.15.1 was tagged without publishing.
      - name: actionlint
        run: |
          curl -sSfLo actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tgz" \
            | sha256sum -c
          tar -xzf actionlint.tgz actionlint
          ./actionlint
