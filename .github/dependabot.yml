version: 2
updates:
  # pnpm workspace: the root lockfile covers the app and every package.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a version: a compromised release is usually
    # yanked within days, and nothing here depends on being on the newest patch
    # the hour it lands.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # Actions used by the workflows themselves.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # Actions used by our own composite action. A root entry does not scan
  # .github/actions, so this entry is what keeps the pins in
  # .github/actions/setup/action.yml fresh.
  - package-ecosystem: github-actions
    directory: /.github/actions/setup
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
